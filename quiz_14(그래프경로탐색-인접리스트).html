    <script>
        function solution(n, arr) {
            let answer = 0;

            let graph = [];
            for (let i = 0; i <= n; i++) graph.push([]);

            let ch = [];
            for (let i = 0; i <= n; i++) ch.push(0);

            let path = [];

            for (let i = 0; i < arr.length; i++) {
                const a = arr[i][0];
                const b = arr[i][1];
                graph[a].push(b);
            }

            function DFS(v) {
                if (v === n) {
                    answer++;
                    console.log(path);
                } else {
                    for (let i = 0; i < graph[v].length; i++) {
                        const nv = graph[v][i];
                        if (ch[nv] === 0) {
                            ch[nv] = 1;
                            path.push(nv);
                            DFS(nv);
                            path.pop();
                            ch[nv] = 0;
                        }
                    }
                }
            }

            ch[1] = 1;
            DFS(1);

            return answer;
        }

        let arr = [
            [1, 2], [1, 3], [1, 4], [2, 1], [2, 3], [2, 5], [3, 4], [4, 2], [4, 5]
        ];
        
        console.log(solution(5, arr));
    </script>
